═══════════════════════════════════════════════════════════════════════

  FILES        index.html · style.css · sound.js

               2  #icons — the five social glyphs
               3  .masthead — wordmark

═══════════════════════════════════════════════════════════════════════
-->

            <stop offset="1" stop-color="#171426"/>

          <linearGradient id="leftwall" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#191629"/>
            <stop offset="1" stop-color="#332c4d"/>
          </linearGradient>
          <linearGradient id="ceiling" x1="0" y1="0" x2=".3" y2="1">
            <stop offset="0" stop-color="#100e1c"/>
            <stop offset="1" stop-color="#2b2542"/>
          </linearGradient>
          <linearGradient id="floor" x1=".15" y1="0" x2=".8" y2="1">

            <stop offset=".45" stop-color="#241f38"/>
            <stop offset="1"   stop-color="#100d1b"/>

            <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>

        <g clip-path="url(#room)">
